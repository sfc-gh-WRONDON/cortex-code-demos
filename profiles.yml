cardworks_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      authenticator: externalbrowser
      database: CARDWORKS_DEMO
      schema: DEV
      warehouse: CARDWORKS_WH
      threads: 4
